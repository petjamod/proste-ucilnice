<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5F4">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Proste učilnice">
<title>Proste učilnice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F4; --card:#FFFFFF; --ink:#16201C; --muted:#64716C; --line:#E1E6E3;
  --green:#1F6B52; --green-ink:#FFFFFF; --soft:#E6F1EC; --soft-ink:#1F6B52; --soft-line:#CFE3D9;
  --warn:#9A5B13; --warn-bg:#FBF0E1;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Barlow,"Segoe UI",Roboto,Arial,sans-serif;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.cond{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
h1{font:500 13px/1.2 Barlow,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.dan{position:relative;display:inline-block;font:700 30px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 12px;cursor:pointer}
.dan span{border-bottom:2px dotted #B9C3BE}
.dan input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px;cursor:pointer}

.ure{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 16px;padding:2px 16px 4px;scrollbar-width:none}
.ure::-webkit-scrollbar{display:none}
.ura{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px 5px 11px;
  font:inherit;cursor:pointer;display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.ura b{font:700 17px/1.1 "Barlow Condensed","Arial Narrow",sans-serif}
.ura small{font-size:12px;color:var(--muted)}
.ura[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.ura[aria-pressed="true"] small{color:inherit;opacity:.8}
.ura:focus-visible,.dan:focus-within span,select:focus-visible,summary:focus-visible,.moznosti:focus-within{outline:2px solid var(--green);outline-offset:2px}

.kartica{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:18px}
.razred-glava{display:flex;align-items:center;justify-content:space-between;gap:10px}
.razred-glava span{font-size:13px;color:var(--muted)}
select{font:600 15px Barlow,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 26px 5px 10px;
  appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:right 12px center,right 7px center;background-size:5px 5px;background-repeat:no-repeat}
.pouki{margin-top:10px;display:grid;gap:8px}
.pouk{display:flex;align-items:center;gap:12px}
.pouk .uc{flex:0 0 auto;min-width:46px;height:42px;padding:0 8px;border-radius:9px;background:var(--green);color:var(--green-ink);
  display:flex;align-items:center;justify-content:center;font:700 22px/1 "Barlow Condensed","Arial Narrow",sans-serif}
.pouk .uc.crk{font-size:15px}
.pouk b{display:block;font-weight:600;font-size:16px;line-height:1.2}
.pouk small{color:var(--muted);font-size:13px}
.pouk.odpade .uc{background:var(--line);color:var(--muted)}
.pouk.odpade b{text-decoration:line-through;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--warn-bg);color:var(--warn);margin-left:4px;vertical-align:1px}
.nic{margin:10px 0 0;color:var(--muted)}
.potem{margin:10px 0 0;padding-top:9px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.potem b{color:var(--ink);font-weight:600}

.povzetek{margin:0 0 4px;font-weight:500}
.legenda{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:0 0 14px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legenda .t{background:var(--green)} .legenda .s{background:var(--soft);border:1px solid var(--soft-line)}
.nad{margin-bottom:14px}
.nad h2{display:flex;justify-content:space-between;font:600 13px/1.2 Barlow,sans-serif;color:var(--muted);margin:0 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.nad h2 span{font-weight:400}
.mreza{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.tabla{border-radius:9px;padding:6px 8px 5px;background:var(--green);color:var(--green-ink);min-height:52px}
.tabla.mirna{background:var(--soft);color:var(--soft-ink);border:1px solid var(--soft-line)}
.tabla b{display:block;font:700 22px/1 "Barlow Condensed","Arial Narrow",sans-serif}
.tabla small{display:block;font-size:11px;line-height:1.2;margin-top:4px;opacity:.85;white-space:nowrap}
.prazno{color:var(--muted);font-size:13px;margin:0}

details{margin-top:18px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;color:var(--muted);font-size:14px}
.zasedene{font-size:13px;margin-top:8px;display:grid;gap:4px}
.zasedene div{display:flex;gap:8px}
.zasedene b{flex:0 0 38px;font:700 15px/1.3 "Barlow Condensed","Arial Narrow",sans-serif}
.moznosti{display:flex;align-items:center;gap:8px;margin:16px 0 0;color:var(--muted);font-size:14px}
footer{margin-top:22px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Proste učilnice · Gimnazija Kranj</h1>
  <label class="dan"><input type="date" id="datum" aria-label="Izberi dan"><span id="dan-besedilo">…</span></label>
  <div class="ure" id="ure" role="group" aria-label="Šolska ura"></div>
  <section class="kartica" id="razred-kartica" hidden>
    <div class="razred-glava"><span>Moj razred</span><select id="razred" aria-label="Moj razred"><option value="">izberi</option></select></div>
    <div id="razred-vsebina"></div>
  </section>
  <p class="povzetek" id="povzetek">Nalagam urnike …</p>
  <div class="legenda" id="legenda" hidden><span><i class="t"></i>uro prej pouk</span><span><i class="s"></i>uro prej prazna</span></div>
  <div id="rezultat"></div>
  <label class="moznosti"><input type="checkbox" id="vsi"> Prikaži tudi telovadnice, bazen in druge posebne prostore</label>
  <footer id="noga"></footer>
</main>
<script>
(function(){
  var ZADNJA_URA=10;
  var NADSTROPJA={0:'Pritličje',1:'1. nadstropje',2:'2. nadstropje',4:'Zgornje nadstropje',99:'Drugi prostori'};
  var KLJUC='proste-ucilnice';
  var data=null, izbranaUra=null;
  var $=function(id){return document.getElementById(id)};
  var pad=function(n){return (n<10?'0':'')+n};
  var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
  var izYmd=function(s){var a=s.split('-');return new Date(+a[0],a[1]-1,+a[2])};
  var vikend=function(d){return d.getDay()===0||d.getDay()===6};
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var cas=function(m){return Math.floor(m/60)+':'+pad(m%60)};
  var prosta=function(t){return t===''||/odpad/i.test(t)};
  var predmet=function(s){return String(s).replace(/\s*-\s*/g,' ')};
  var stevilo=function(n){var m=n.match(/^(\d+)\s*\./);return m?+m[1]:null};

  function nastavitve(){try{return JSON.parse(localStorage.getItem(KLJUC))||{}}catch(e){return{}}}
  function shrani(){try{localStorage.setItem(KLJUC,JSON.stringify({razred:$('razred').value,vsi:$('vsi').checked}))}catch(e){}}

  function vidna(u){var s=stevilo(u.lab);return /predur/i.test(u.lab)||(s!=null&&s<=ZADNJA_URA)}
  function kratko(u){var s=stevilo(u.lab);return s!=null?s+'.':/predur/i.test(u.lab)?'Pred':u.lab.split(' ')[0]}
  function kdaj(u){var s=stevilo(u.lab);return s!=null?'v '+s+'. uri':/predur/i.test(u.lab)?'v preduri':'v terminu '+u.lab.split(' ')[0]}
  function imeUre(u){var s=stevilo(u.lab);return s!=null?s+'. ura':/predur/i.test(u.lab)?'predura':u.lab.split(' ')[0]}

  function nadstropje(n){
    if(!/^\d+$/.test(n))return 99;
    var x=+n; if(x<10)return 0; if(x>=21&&x<=31)return 2; return Math.floor(x/10);
  }
  function imeNadstropja(k){return NADSTROPJA[k]||k+'. nadstropje'}

  function tedenZa(d){
    var s=ymd(d);
    for(var i=0;i<data.tedni.length;i++){var k=data.tedni[i].dni.indexOf(s);if(k>=0)return{w:data.tedni[i],dan:k}}
    return null;
  }
  function rabljena(t,i){return Object.keys(t.w.ucilnice).some(function(k){return t.w.ucilnice[k][i][t.dan]!==''})}
  function casovne(t){return t.w.ure.map(function(u,i){return{u:u,i:i}}).filter(function(o){return o.u.a!=null&&vidna(o.u)})}
  function prvaRabljena(t){var s=casovne(t);for(var q=0;q<s.length;q++)if(rabljena(t,s[q].i))return s[q].i;return s.length?s[0].i:0}
  function konecPouka(t){var k=0;casovne(t).forEach(function(o){if(rabljena(t,o.i))k=Math.max(k,o.u.b)});return k}

  function privzeto(){
    var zdaj=new Date(), d=new Date(zdaj.getFullYear(),zdaj.getMonth(),zdaj.getDate());
    var min=zdaj.getHours()*60+zdaj.getMinutes(), t=tedenZa(d), ura=0;
    if(vikend(d)||!t||min>=konecPouka(t)){
      do{d.setDate(d.getDate()+1)}while(vikend(d));
      t=tedenZa(d); ura=t?prvaRabljena(t):0;
    }else{
      var s=casovne(t); ura=s.length?s[s.length-1].i:0;
      for(var j=0;j<s.length;j++){if(s[j].u.b>min){ura=s[j].i;break}}
      ura=Math.max(ura,prvaRabljena(t));
    }
    $('datum').value=ymd(d); izbranaUra=ura;
  }

  function narisiUre(w){
    var html='';
    w.ure.forEach(function(u,i){
      if(!vidna(u))return;
      var rab=Object.keys(w.ucilnice).some(function(k){return w.ucilnice[k][i].some(function(c){return c!==''})});
      if(!rab&&i!==izbranaUra)return;
      html+='<button class="ura" data-i="'+i+'" aria-pressed="'+(i===izbranaUra)+'"><b>'+esc(kratko(u))+'</b><small>'+(u.a!=null?cas(u.a):'')+'</small></button>';
    });
    $('ure').innerHTML=html;
    var sel=$('ure').querySelector('[aria-pressed="true"]');
    if(sel&&sel.scrollIntoView)sel.scrollIntoView({block:'nearest',inline:'center'});
  }

  function ucilnicaHtml(u){var crk=!/^\d+$/.test(u);return '<span class="uc'+(crk?' crk':'')+'">'+esc(u||'?')+'</span>'}
  function oznakeHtml(o){
    if(!o)return '';
    return o.split(', ').filter(function(x){return x&&!/odpad/.test(x)}).map(function(x){return '<span class="tag">'+esc(x)+'</span>'}).join('');
  }
  function zivi(cell){return (cell||[]).filter(function(x){return !/odpad/.test(x[4])})}

  function narisiRazred(w,dan,i){
    var r=$('razred').value, box=$('razred-vsebina');
    if(!r||!w.razredi||!w.razredi[r]){box.innerHTML=r?'<p class="nic">Za ta teden ni urnika oddelka '+esc(r)+'.</p>':'<p class="nic">Izberi razred in tu bo pisalo, kje imaš pouk.</p>';return}
    var m=w.razredi[r], cell=m[i][dan]||[], html='';
    if(cell.length){
      html+='<div class="pouki">'+cell.map(function(x){
        var odp=/odpad/.test(x[4]);
        return '<div class="pouk'+(odp?' odpade':'')+'">'+ucilnicaHtml(x[2])+'<div><b>'+esc(predmet(x[0]))+'</b><small>'+esc(x[3])+(odp?' · odpade':'')+'</small>'+oznakeHtml(x[4])+'</div></div>';
      }).join('')+'</div>';
    }else{
      html+='<p class="nic">'+esc(kdaj(w.ure[i]).replace(/^v/,'V'))+' nimaš pouka.</p>';
    }
    var nasl=null;
    for(var j=i+1;j<m.length;j++){if(zivi(m[j][dan]).length){nasl=j;break}}
    if(nasl!=null){
      var u=w.ure[nasl], z=zivi(m[nasl][dan]);
      var kje=z.map(function(x){return esc(predmet(x[0]))+' v '+esc(x[2]||'?')}).slice(0,3).join(', ')+(z.length>3?' …':'');
      html+='<p class="potem">Potem: <b>'+esc(imeUre(u))+(u.a!=null?' ob '+cas(u.a):'')+'</b>, '+kje+'</p>';
    }else{
      html+='<p class="potem">'+(cell.length?'Potem ta dan nimaš več pouka.':'Ta dan nimaš več pouka.')+'</p>';
    }
    box.innerHTML=html;
  }

  function napolniRazrede(){
    var imena={};
    data.tedni.forEach(function(w){Object.keys(w.razredi||{}).forEach(function(n){imena[n]=1})});
    var s=Object.keys(imena).sort(function(a,b){return a.localeCompare(b,'sl',{numeric:true})});
    if(!s.length)return;
    $('razred').innerHTML='<option value="">izberi</option>'+s.map(function(n){return '<option>'+esc(n)+'</option>'}).join('');
    var shranjen=nastavitve().razred;
    if(shranjen&&imena[shranjen])$('razred').value=shranjen;
    $('razred-kartica').hidden=false;
  }

  function prazen(sporocilo){$('ure').innerHTML='';$('povzetek').textContent=sporocilo;$('rezultat').innerHTML='';$('legenda').hidden=true;$('razred-kartica').hidden=true}

  function izrisi(){
    var d=izYmd($('datum').value);
    $('dan-besedilo').textContent=d.toLocaleDateString('sl-SI',{weekday:'long',day:'numeric',month:'numeric'});
    if(vikend(d))return prazen('Ta dan ni pouka.');
    var t=tedenZa(d);
    if(!t)return prazen('Za ta dan urnika še ni. Na voljo sta tekoči in naslednji teden.');
    var w=t.w, dan=t.dan;
    if(izbranaUra==null||izbranaUra>=w.ure.length||!vidna(w.ure[izbranaUra]))izbranaUra=prvaRabljena(t);
    narisiUre(w);
    var i=izbranaUra, vsi=$('vsi').checked;
    $('razred-kartica').hidden=$('razred').options.length<2;
    narisiRazred(w,dan,i);

    var zadnja=0; w.ure.forEach(function(u,k){if(vidna(u))zadnja=k});
    var imena=Object.keys(w.ucilnice).filter(function(n){return vsi||/^\d+$/.test(n)});
    imena.sort(function(a,b){return a.localeCompare(b,'sl',{numeric:true})});
    var nad={}, zasedene=[], st=0;
    imena.forEach(function(n){
      var m=w.ucilnice[n], zdaj=m[i][dan], k=nadstropje(n);
      nad[k]=nad[k]||[];
      if(!prosta(zdaj)){zasedene.push({n:n,zdaj:zdaj});return}
      var j=i; while(j+1<=zadnja&&prosta(m[j+1][dan]))j++;
      st++;
      nad[k].push({n:n,prej:i>0?m[i-1][dan]:'',odp:/odpad/i.test(zdaj),do_:w.ure[j].b});
    });
    var u=w.ure[i];
    var sk=st%100===1?' prosta učilnica':st%100===2?' prosti učilnici':(st%100===3||st%100===4)?' proste učilnice':' prostih učilnic';
    $('povzetek').textContent=st+sk+' '+kdaj(u)+(u.a!=null?' ('+cas(u.a)+' do '+cas(u.b)+')':'');
    $('legenda').hidden=!st;

    var html=!st?'<p class="prazno">V tej uri ni nobena učilnica prosta. Izberi drugo uro zgoraj.</p>':Object.keys(nad).map(Number).sort(function(a,b){return a-b}).map(function(k){
      var p=nad[k];
      return '<section class="nad"><h2>'+esc(imeNadstropja(k))+'<span>'+(p.length?p.length+(p.length===1?' prosta':p.length===2?' prosti':p.length<5?' proste':' prostih'):'')+'</span></h2>'+
        (p.length?'<div class="mreza">'+p.map(function(o){
          var opomba=o.odp?'odpade':o.do_!=null?'do '+cas(o.do_):'';
          return '<div class="tabla'+(o.prej===''?' mirna':'')+'" title="'+(o.prej===''?'uro prej prazna':'uro prej pouk')+'"><b>'+esc(o.n)+'</b><small>'+opomba+'</small></div>';
        }).join('')+'</div>':'<p class="prazno">Nič prostega.</p>')+'</section>';
    }).join('');
    html+='<details><summary>Zasedene ('+zasedene.length+')</summary><div class="zasedene">'+zasedene.map(function(o){return '<div><b>'+esc(o.n)+'</b><span>'+esc(o.zdaj)+'</span></div>'}).join('')+'</div></details>';
    $('rezultat').innerHTML=html;
  }

  $('ure').addEventListener('click',function(e){var b=e.target.closest('.ura');if(!b)return;izbranaUra=+b.getAttribute('data-i');izrisi()});
  $('datum').addEventListener('change',function(){if($('datum').value)izrisi()});
  $('vsi').addEventListener('change',function(){shrani();izrisi()});
  $('razred').addEventListener('change',function(){shrani();izrisi()});

  $('vsi').checked=!!nastavitve().vsi;
  fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(j){
    data=j; napolniRazrede(); privzeto(); izrisi();
    var s=new Date(j.spremenjeno);
    $('noga').textContent='Urniki se z eAsistenta preverjajo vsakih 30 minut med poukom. Zadnja sprememba: '+s.toLocaleString('sl-SI',{weekday:'short',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})+'. Učilnica brez pouka v urniku je lahko vseeno zasedena ali zaklenjena.';
  }).catch(function(e){console.error(e);$('povzetek').textContent='Podatkov ni bilo mogoče naložiti. Osveži stran čez minuto.'});
})();
</script>
</body>
</html>
