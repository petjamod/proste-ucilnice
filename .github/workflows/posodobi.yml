name: Posodobi urnike

on:
  schedule:
    # vsakih 30 minut, pon do pet, 5.00 do 15.30 po zimskem času (UTC +1)
    - cron: "*/30 4-14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: posodobi
  cancel-in-progress: false

jobs:
  posodobi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scrape.py
      - name: Shrani spremembe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Posodobi urnike" && git push)
